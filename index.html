/* Grammar Guide: pixel desk look. The stage is 960 x 540 (the 320 x 180 scene at 3x) and is scaled to fit the window. */
:root {
  --ink: #3B2A2A;
  --paper: #FFF8E7;
  --paper-edge: #E9DCC0;
  --teal: #4FB3A9; --teal-dk: #3A9488; --teal-lt: #7FD1C8;
  --green: #3FAF6B; --green-bg: #E3F5E9;
  --red: #E05A5A; --red-dk: #B94444; --red-bg: #FCE6E6;
  --blue: #4C6FD1; --blue-bg: #E4EBFB;
  --yellow: #FFE873; --yellow-dk: #E8C94F;
  --wood: #B87A45;
  --muted: #7A6355;
  --font: "Pixelify Sans", "Lucida Console", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #E8B888; }
body { font: 18px/1.4 var(--font); color: var(--ink); font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
button, input { font: inherit; color: inherit; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.viewport { position: fixed; inset: 0; background: #E8B888; }
.stage { position: absolute; left: 50%; top: 50%; width: 960px; height: 540px; transform-origin: center; overflow: hidden; }
.scene { position: absolute; inset: 0; width: 960px; height: 540px; image-rendering: pixelated; image-rendering: crisp-edges; }
.layer { position: absolute; inset: 0; }
.layer > * { position: absolute; }
.stage.shake { animation: shake .25s steps(5); }
@keyframes shake { 0%{translate:0 0} 20%{translate:-6px 3px} 40%{translate:5px -3px} 60%{translate:-4px 2px} 80%{translate:3px -2px} 100%{translate:0 0} }

/* pixel panels and buttons */
.px-panel { background: var(--paper); border: 3px solid var(--ink);
  box-shadow: inset 3px 3px 0 #FFFFFF, inset -3px -3px 0 var(--paper-edge), 6px 6px 0 rgba(59,42,42,.25); padding: 18px 22px; }
.px-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 16px; cursor: pointer;
  background: var(--teal); color: #fff; border: 3px solid var(--ink); font-size: 18px; line-height: 1.2;
  box-shadow: inset 3px 3px 0 var(--teal-lt), inset -3px -3px 0 var(--teal-dk); text-shadow: 2px 2px 0 var(--teal-dk); }
.px-btn:hover:not(:disabled) { filter: brightness(1.06); }
.px-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 3px 3px 0 var(--teal-dk); }
.px-btn:disabled { opacity: .5; cursor: default; }
.px-btn.big { font-size: 22px; padding: 9px 22px; }
.px-btn.small { font-size: 15px; padding: 3px 10px; }
.px-btn.ghost { background: var(--paper); color: var(--ink); text-shadow: none; box-shadow: inset 3px 3px 0 #fff, inset -3px -3px 0 var(--paper-edge); }
.px-btn.link { background: none; border-color: transparent; box-shadow: none; color: var(--blue); text-shadow: none; text-decoration: underline; padding: 2px 4px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.row.center { justify-content: center; }
.tiny { font-size: 14px; color: var(--muted); margin: 4px 0; }
.warn-text { color: var(--red-dk); }
.hit { background: transparent; border: 0; padding: 0; cursor: pointer; }
.hit:disabled { cursor: default; }
.hit:focus-visible { outline: 3px solid var(--blue); }

/* markdown inside papers */
.md p, .md ul, .md ol { margin: 0 0 10px; }
.md h2, .md h3, .md h4, .md h5 { margin: 14px 0 6px; font-size: 20px; line-height: 1.2; }
.md ul, .md ol { padding-left: 24px; }
.md blockquote { margin: 10px 0; padding: 8px 12px; background: var(--blue-bg); border-left: 6px solid var(--blue); }
.md blockquote p:last-child { margin: 0; }
.md code { background: #F1E6CC; padding: 0 4px; }
.md img { max-width: 100%; image-rendering: auto; }
.md del { color: var(--red); }
.md table { border-collapse: collapse; width: 100%; font-size: 16px; margin-bottom: 10px; }
.md th, .md td { border: 2px solid var(--paper-edge); padding: 4px 8px; text-align: left; }
.md th { background: #F6EBD3; }
.ex-good { color: #1F7A44; background: var(--green-bg); padding: 4px 10px; border-left: 6px solid var(--green); }
.ex-bad { color: var(--red-dk); background: var(--red-bg); padding: 4px 10px; border-left: 6px solid var(--red); }
.img-missing { display: inline-block; padding: 8px; border: 3px dashed #C9B48F; color: var(--muted); font-size: 14px; }

/* title, planner, review */
.title-wrap, .planner-wrap { display: flex; align-items: center; justify-content: center; }
.title-panel { width: 100%; max-height: 100%; overflow: auto; text-align: center; }
.title-firm { margin: 0; letter-spacing: 4px; text-transform: uppercase; color: var(--blue); font-size: 16px; }
.title-name { font-size: 40px; line-height: 1.1; margin: 8px 0 4px; color: var(--ink); text-shadow: 3px 3px 0 var(--yellow); }
.title-sub { margin: 0 0 8px; color: var(--muted); }
.title-intro { text-align: left; font-size: 16px; max-width: 560px; margin: 8px auto 0; }
.title-options { margin-top: 16px; text-align: left; border-top: 3px dotted var(--paper-edge); padding-top: 8px; font-size: 16px; }
.title-options summary, .warnings summary, .review summary { cursor: pointer; }
.check { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.check input { width: 18px; height: 18px; accent-color: var(--teal); }
.warnings { margin-top: 12px; text-align: left; background: #FFF1C9; border: 3px solid #E0B54A; padding: 8px 12px; font-size: 15px; }
.warnings summary { color: #8A5A00; }
.planner { width: 100%; max-height: 100%; overflow: auto; }
.planner-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.planner-head h1 { margin: 0 0 8px; font-size: 28px; }
.planner-total { margin: 0; }
.planner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.day-card { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; text-align: left; cursor: pointer;
  background: #fff; border: 3px solid var(--ink); box-shadow: inset 0 8px 0 var(--red), 4px 4px 0 rgba(59,42,42,.2); padding-top: 16px; min-height: 96px; }
.day-card:hover:not(:disabled) { transform: translateY(-2px); }
.day-card.is-next { box-shadow: inset 0 8px 0 var(--teal), 0 0 0 4px var(--yellow), 4px 4px 0 rgba(59,42,42,.2); }
.day-card.is-done { background: #F3FBF5; box-shadow: inset 0 8px 0 var(--green), 4px 4px 0 rgba(59,42,42,.2); }
.day-card.is-locked { background: #EFE6D8; color: #9A8778; cursor: not-allowed; box-shadow: inset 0 8px 0 #B9A898; }
.day-no { font-size: 14px; color: var(--muted); }
.day-name { font-size: 18px; line-height: 1.15; }
.day-stat { margin-top: auto; display: flex; gap: 8px; align-items: center; font-size: 15px; }
.day-pay { color: #8A5A00; }
.stars { color: #E0A21A; letter-spacing: 2px; font-size: 20px; text-shadow: 1px 1px 0 #8A5A00; }

/* overlays */
.overlay { inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(59,42,42,.35); z-index: 10; }
.day-intro { text-align: center; min-width: 380px; max-width: 560px; }
.day-intro h1 { margin: 0 0 6px; font-size: 30px; }
.day-big { font-size: 46px; margin: 0; color: var(--teal-dk); text-shadow: 3px 3px 0 var(--yellow); }
.day-intro.fired .day-big { color: var(--red); }

/* boss speech */
.bubble { z-index: 8; background: #fff; border: 3px solid var(--ink); padding: 6px 10px; display: flex; flex-direction: column; justify-content: center;
  box-shadow: 4px 4px 0 rgba(59,42,42,.2); animation: pop .2s steps(3); font-size: 17px; line-height: 1.15; }
.bubble::before { content: ""; position: absolute; top: -12px; left: 200px; border: 6px solid transparent; border-bottom-color: var(--ink); }
.bubble-name { font-size: 13px; color: var(--blue); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* the work zone in the middle of the desk */
.zone { display: flex; flex-direction: column; gap: 6px; z-index: 2; }
.zone-foot { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex: 0 0 auto; min-height: 36px; }
.paper { background: var(--paper); border: 3px solid var(--ink); flex: 1 1 auto; overflow-y: auto; padding: 12px 16px; font-size: 17px; line-height: 1.45;
  box-shadow: inset 3px 3px 0 #fff, inset -3px -3px 0 var(--paper-edge), 6px 6px 0 rgba(60,30,10,.2); position: relative; }
.card-small { flex: 0 1 auto; }
.paper-tag { margin: 0 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.paper-title { margin: 0 0 8px; font-size: 22px; line-height: 1.15; }
.paper-bar { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin: -4px 0 6px; }
.paper-bar .paper-tag { margin: 0; }
.counter { font-size: 14px; color: var(--blue); white-space: nowrap; }
.tips { padding-left: 20px; font-size: 15px; margin: 8px 0 0; }
.tips li { margin-bottom: 4px; }
.doc-head { margin-bottom: 10px; font-size: 15px; }
.head-rows { display: grid; grid-template-columns: max-content 1fr; gap: 0 10px; margin: 0; }
.head-rows dt { color: var(--muted); text-transform: uppercase; font-size: 13px; padding-top: 2px; }
.head-rows dd { margin: 0; }
.memo-word { letter-spacing: 6px; text-transform: uppercase; color: var(--blue); margin: 0 0 4px; font-size: 15px; }
.head-memo { border-bottom: 3px solid var(--ink); padding-bottom: 6px; }
.head-email { background: var(--blue-bg); border: 2px solid #C5D2F2; padding: 6px 8px; }
.letterhead { text-align: center; letter-spacing: 3px; text-transform: uppercase; color: var(--blue); border-bottom: 3px double var(--paper-edge); padding-bottom: 4px; margin: 0 0 6px; }
.court-head { text-align: center; border-bottom: 3px solid var(--ink); padding-bottom: 6px; }
.court-head p { margin: 2px 0; display: flex; flex-direction: column; }
.court-label { font-size: 12px; color: var(--muted); text-transform: uppercase; }
.court-value { text-transform: uppercase; }
.doc-intro { font-size: 15px; color: var(--muted); }

/* sticky notes */
.sticky { background: var(--yellow); border: 3px solid #B9993A; flex: 0 1 auto; max-height: 100%; overflow-y: auto; padding: 22px 16px 14px; position: relative; font-size: 18px;
  box-shadow: inset 3px 3px 0 #FFF4A8, inset -3px -3px 0 var(--yellow-dk), 6px 6px 0 rgba(60,30,10,.22); }
.tape { position: absolute; top: -2px; left: 50%; width: 90px; height: 18px; margin-left: -45px; background: rgba(255,255,255,.6); border: 2px solid rgba(255,255,255,.8); }
.sticky-from { margin: 0 0 6px; font-size: 14px; color: #8C6A2A; }
.sticky-q { font-size: 19px; }
.opts { display: grid; gap: 6px; margin-top: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 6px 10px; cursor: pointer; background: #FFFBE0;
  border: 3px solid #B9993A; box-shadow: inset -3px -3px 0 #F4E39A; font-size: 17px; line-height: 1.3; }
.opt:hover:not(:disabled) { background: #fff; border-color: var(--ink); }
.opt:disabled { cursor: default; }
.opt-l { flex: 0 0 24px; height: 24px; display: grid; place-items: center; background: var(--ink); color: #fff; font-size: 14px; }
.opt.right { background: var(--green-bg); border-color: var(--green); opacity: 1; }
.opt.right .opt-l { background: var(--green); }
.opt.wrong { background: var(--red-bg); border-color: var(--red); text-decoration: line-through; opacity: .85; }
.opt.wrong .opt-l { background: var(--red); }
.note-fb { margin-top: 8px; font-size: 16px; }
.note-fb:empty { display: none; }
.note-fb.good { color: #1F7A44; }
.note-fb.bad { color: var(--red-dk); }
.note-fb.hint { color: #6B4A00; }
.wobble { animation: wobble .3s steps(4); }
@keyframes wobble { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }

/* proofreading */
.passage { line-height: 1.75; }
.passage-body p { margin: 0 0 10px; }
.passage-heading { text-align: center; text-transform: uppercase; letter-spacing: 2px; }
.tok { cursor: pointer; padding: 0 1px; }
.tok:hover { background: #FFF0A0; box-shadow: 0 0 0 2px #E6CF6D; }
.tok.sel { background: #FFE066; box-shadow: 0 0 0 3px #D4A90F; }
.tok.over { background: #FFE2B3; text-decoration: underline wavy #C98A00; cursor: default; box-shadow: none; }
.tok.fixed { background: var(--green-bg); cursor: default; box-shadow: none; }
.tok.revealed, .tok.missed { background: var(--blue-bg); cursor: default; box-shadow: none; }
.tok del { color: var(--red); }
.tok ins { color: #1F7A44; text-decoration: none; }
.tok.revealed ins, .tok.missed ins { color: var(--blue); }
.paper.locked .tok { cursor: default; }
.paper.locked .tok:hover { background: none; box-shadow: none; }
.paper.locked .tok.fixed { background: var(--green-bg); }
.paper.locked .tok.missed, .paper.locked .tok.revealed { background: var(--blue-bg); }
.paper.locked .tok.over { background: #FFE2B3; }
.log { margin: 10px 0 0; padding-left: 22px; font-size: 14px; line-height: 1.35; border-top: 3px dotted var(--paper-edge); padding-top: 6px; }
.log:empty { display: none; }
.l-missed, .l-revealed { color: var(--blue); }
.doc-msg { flex: 0 0 auto; font-size: 15px; padding: 4px 10px; background: #fff; border: 3px solid var(--ink); }
.doc-msg:empty { display: none; }
.doc-msg.good { background: var(--green-bg); color: #1F7A44; }
.doc-msg.bad { background: var(--red-bg); color: var(--red-dk); }
.doc-msg.info, .doc-msg.hint { background: #FFF6D0; color: #6B4A00; }
.fix-panel { flex: 0 0 auto; background: #fff; border: 3px solid #D4A90F; padding: 8px; box-shadow: 4px 4px 0 rgba(59,42,42,.2); }
.fix-label { margin: 0 0 6px; font-size: 15px; }
.fix-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.fix-row + .fix-row { margin-top: 4px; }
.fix-input { flex: 1 1 140px; min-width: 0; padding: 4px 8px; border: 3px solid var(--ink); font-size: 17px; background: var(--paper); }
.stamp-help { margin-right: auto; color: var(--ink); font-size: 16px; animation: nudge 1s steps(2) infinite; }
@keyframes nudge { 50% { transform: translateX(4px); } }
.impression { position: absolute; top: 10px; right: 10px; transform: rotate(-12deg); font-size: 34px; text-transform: uppercase; letter-spacing: 3px;
  padding: 2px 14px; border: 5px solid currentColor; opacity: .82; pointer-events: none; animation: thud .22s steps(3); background: rgba(255,255,255,.35); }
.imp-approve { color: var(--green); }
.imp-return { color: var(--red); }
@keyframes thud { from { transform: rotate(-12deg) scale(2); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: .82; } }

/* moving papers */
.enter { animation: slide-in .35s steps(6); }
@keyframes slide-in { from { transform: translate(-300px, 90px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.fly-out { transition: transform .35s steps(6), opacity .35s steps(6); transform: translate(-300px, 200px) scale(.25); opacity: 0; }
.fly-binder { transition: transform .4s steps(6), opacity .4s steps(6); transform: translate(330px, 330px) scale(.15); opacity: 0; }
.float { z-index: 20; font-size: 20px; pointer-events: none; animation: float-up 1.1s steps(8) forwards; text-shadow: 2px 2px 0 var(--ink); }
.float.gain { color: #FFE066; }
.float.loss { color: #FFB3B3; }
@keyframes float-up { from { transform: translateY(0); opacity: 1; } to { transform: translateY(40px); opacity: 0; } }

/* rulebook */
.book { width: 760px; height: 470px; display: flex; flex-direction: column; background: var(--blue); border: 3px solid var(--ink); padding: 10px;
  box-shadow: inset 3px 3px 0 #7A8CE0, inset -3px -3px 0 #3A55A8, 8px 8px 0 rgba(59,42,42,.3); }
.book-head { display: flex; align-items: center; gap: 12px; color: #fff; padding: 0 4px 8px; font-size: 22px; }
.book-head .tiny { color: #DCE4FB; margin: 0 auto 0 0; }
.book-head strong { margin-right: auto; }
.book-head .tiny + .px-btn, .book-head strong + .px-btn { margin-left: auto; }
.book-body { flex: 1; display: flex; gap: 8px; min-height: 0; }
.book-tabs { flex: 0 0 200px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.book-tabs button { text-align: left; padding: 4px 8px; background: #DCE4FB; border: 3px solid var(--ink); cursor: pointer; font-size: 15px; line-height: 1.15; display: flex; flex-direction: column; }
.book-tabs button.cur { background: var(--paper); }
.tab-day { font-size: 12px; color: var(--muted); }
.book-page { flex: 1; overflow-y: auto; background: var(--paper); border: 3px solid var(--ink); padding: 12px 18px; font-size: 17px; }
.book-page h2 { margin-top: 0; }

/* pay slip */
.slip { width: 600px; max-height: 500px; overflow-y: auto; }
.slip-head { border-bottom: 3px dashed var(--paper-edge); margin-bottom: 8px; }
.slip-kicker { margin: 0; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.slip-head h1 { margin: 2px 0 8px; font-size: 28px; }
.slip-rows { width: 100%; border-collapse: collapse; font-size: 17px; }
.slip-rows th { text-align: left; font-weight: 400; padding: 3px 0; border-bottom: 2px dotted var(--paper-edge); }
.slip-rows td { padding: 3px 0 3px 12px; border-bottom: 2px dotted var(--paper-edge); white-space: nowrap; }
.slip-rows .c { text-align: center; }
.slip-rows .a { text-align: right; }
.slip-total { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 10px 0; font-size: 20px; flex-wrap: wrap; }
.boss-note { margin: 8px 0; padding: 8px 12px; background: #F6EBD3; border-left: 6px solid var(--blue); }
.boss-note p { margin: 0; font-size: 20px; }
.boss-note cite { display: block; font-style: normal; font-size: 14px; color: var(--muted); }
.review { margin-top: 8px; font-size: 16px; }
.review li { margin: 6px 0; }
.review-answer { color: #1F7A44; margin: 2px 0; }
.review-panel { width: 100%; }

@media (prefers-reduced-motion: reduce) {
  .enter, .wobble, .stage.shake, .impression, .bubble, .float, .stamp-help { animation: none; }
  .fly-out, .fly-binder { transition: none; }
}

/* document footer: message + stamp prompt, red-pen box floating over the page */
.zone { position: absolute; }
.doc-foot { justify-content: flex-start; }
.doc-foot .doc-msg { flex: 1 1 auto; }
.doc-foot .doc-msg:not(:empty) ~ .stamp-help { display: none; }
.doc-foot .px-btn { flex: 0 0 auto; }
.fix-panel { position: absolute; left: 6px; right: 6px; bottom: 54px; z-index: 4; }
.float { animation: float-hud 1.1s steps(8) forwards; }
@keyframes float-hud { from { transform: translateY(6px); opacity: 1; } 70% { opacity: 1; } to { transform: translateY(-4px); opacity: 0; } }
.float { background: var(--ink); padding: 0 8px; font-size: 18px; text-shadow: none; border: 2px solid #fff; z-index: 30; }
@keyframes float-hud { from { transform: translateY(-6px); opacity: 1; } 70% { opacity: 1; } to { transform: translateY(6px); opacity: 0; } }
.star-off { color: #D8CBB4; text-shadow: none; }

</style>
</head>

<script>
window.GAME_DATA = {"files":[{"name":"00A Tutorial - Welcome.md","text":"---\nTitle: Welcome to the firm\nLevel: Orientation\nDocument: Email\nFrom: Dana Whitfield, Office Manager\nTo: You\nSubject: Welcome! How your desk works\n---\n\u003e FILLER: replace with your own text.\n\nHi, and welcome to Fewster \u0026 Lessing LLP.\n\nHere\u0027s how your days work:\n\n1. **Each morning**, a lesson lands on your desk. File it in your **Rulebook** (bottom right). You can open the rulebook any time, but the clock keeps running.\n2. **Clock in.** Your inbox fills with work, and the clock starts at 9:00 a.m.\n3. **Sticky notes** are quick questions from your coworkers. Click the right answer.\n4. **Documents** need your stamp. If a document has errors, click each wrong word, correct it, then stamp **RETURN**. If it has no errors, stamp **APPROVE**.\n5. **At 5:00 p.m.** the office closes, and anything left in your inbox is unfinished.\n\nYou earn pay for good work. A wrong stamp costs you a heart, and if you lose all three, you\u0027re fired for the day.\n\n✓ Fix only the words that are wrong.\n✗ Don\u0027t change correct words. Each one costs you time and money.\n\nDana\n"},{"name":"00B Tutorial - Practice.md","text":"---\nTitle: Practice run\nNote 3: You\u0027ll do.\nNote 2: Fine. Read the rulebook before tomorrow.\nNote 1: That was the practice round.\n---\nFILLER: A quick practice before your first real day.\n\n## Question\nWhat should you do with a word that is already correct?\n\nA) Change it to something that sounds more formal\nB) Leave it alone\nAnswer: B\nFeedback A: Changing a correct word counts as an error on a proofreading test.\nHint: Think about what the clock does when you click a correct word.\nExplain: Proofreaders fix errors and leave everything else alone.\n\n## Practice: A clean document\nDocument: Email\nFrom: Dana Whitfield, Office Manager\nTo: You\nSubject: Parking\nFILLER passage. This one has no errors. Stamp it APPROVE.\nPassage:\nYour parking pass is in the top drawer of your desk. Please park on the second level of the parkade.\n\n## Practice: A document with an error\nDocument: Memo\nTo: You\nFrom: Dana Whitfield, Office Manager\nRe: Your desk\nPenalty: 10\nHint: There is one spelling error. Remember: i before e, except after c.\nThis one has one error. Click it, correct it, then stamp it RETURN.\nPassage:\nYour desk is next to the {recieving =\u003e receiving | I before e, except after c.} area on the second floor.\nYour computer password will arrive by email this morning.\n"},{"name":"01A Fewer vs less.md","text":"---\nTitle: Fewer vs. Less\nLevel: The Supply Order\nDocument: Email\nFrom: Dana Whitfield, Office Manager\nTo: You\nSubject: Before you place the supply order\n---\n\u003e FILLER: replace with your rewritten Level 1 page.\n\n**Rule:** Use *fewer* with countable nouns (things you can put a number in front of). Use *less* with non-countable nouns (amounts).\n\n✓ There are fewer people here than I expected.\n✗ We have less volunteers this year. → fewer volunteers\n\n| Countable → fewer | Non-countable → less |\n|---|---|\n| fewer people | less milk |\n| fewer emails | less paperwork |\n| fewer mistakes | less time |\n\n**Test:** put a number in front of the noun. *Three clients* works, so *clients* takes *fewer*.\n"},{"name":"01B Fewer vs less - Test.md","text":"---\nTitle: Fewer vs. Less: Test\n---\n## Question\nThe firm received ___ applications this year than last year.\n\nA) less\nB) fewer\nC) lesser\nAnswer: B\nFeedback A: Applications is a plural countable noun (you can say two applications), so it takes fewer.\nFeedback C: Lesser means lower in importance, as in a lesser charge. It doesn\u0027t mean a smaller number.\nHint: Can you put a number in front of applications?\n\n## Question\nThe new filing system means ___ paperwork for the legal team.\n\nA) fewer\nB) less\nC) lesser\nAnswer: B\nFeedback A: Paperwork is a non-countable noun. You can\u0027t say three paperworks, so it takes less.\nFeedback C: Lesser compares importance, not amount.\nHint: Would you ask how much paperwork or how many paperwork?\n\n## Question\nOur office hired ___ paralegals this year, so each one has ___ free time.\n\nA) fewer / less\nB) less / fewer\nC) fewer / fewer\nD) less / less\nAnswer: A\nFeedback B: The words are reversed. Paralegals can be counted, and free time is an amount.\nFeedback C: Free time is a non-countable noun, so it takes less.\nFeedback D: Paralegals is a plural countable noun, so it takes fewer.\nHint: Ask how many? for one blank and how much? for the other.\n\n## Question\nWhich sentence uses the standard form?\n\nA) The hearing lasted less than three hours.\nB) The hearing lasted fewer than three hours.\nC) Neither sentence is standard.\nAnswer: A\nFeedback B: Three hours is a length of time. We treat a measurement as one amount, so less is standard.\nFeedback C: Sentence A follows the measurement exception, so it is standard.\nHint: Are you counting separate hours or measuring how long the hearing took?\n\n## Inspect: The courier note\nDocument: Email\nFrom: Omar Haddad, Senior Paralegal\nTo: You\nSubject: Courier budget\nFILLER passage. Is it ready to go out?\nPassage:\nWe spent {less =\u003e less | Money is an amount, so less is correct.} than $200 on couriers in October, and we sent {fewer =\u003e fewer | Packages can be counted, so fewer is correct.} packages than in September. Please keep the receipts in the blue folder.\n\n## Mini-boss: The 5 p.m. supply memo\nDocument: Memo\nTo: You\nFrom: Ms. Fewster, Partner\nRe: Supply order\nPenalty: 10\nHint: There are three errors. One \"less\" in this memo is correct.\nFILLER passage. Ms. Fewster needs this memo fixed before it goes to the whole office at 5 p.m.\nPassage:\nWe need to cut costs this quarter, so please order {less =\u003e fewer | Binders can be counted: two binders, three binders.} binders than last time. We also want {fewer =\u003e less | Paper is an amount here. You can\u0027t say three papers.} paper in the recycling bins, so print only what you need.\n\nOur records show that {less =\u003e fewer | Clients are counted one by one.} than 20 clients picked up their files last month. That leaves {less =\u003e less | Money is an amount, so less than $50 is standard.} than $50 in the courier budget.\n"},{"name":"02A Subject-verb agreement.md","text":"---\nTitle: Subject–Verb Agreement: Find the Head\nLevel: The Exhibit List\nDocument: Memo\nTo: All assistants\nFrom: Omar Haddad, Senior Paralegal\nDate: Monday\nRe: Verbs in our court documents\n---\n\u003e FILLER: replace with your rewritten Level 2 page.\n\n**Rule:** The verb matches the head of the subject (its main noun), not the words around it.\n\n✓ A shipment of shoes has been delayed. (head: shipment)\n✗ The analysis of the results reveal a rise. → reveals\n\n**Cross-out test:** cross out the phrase that starts with *of*, *for* or *with*, then read the subject and verb together.\n\nThe analysis ~~of the results~~ reveals a rise.\n"},{"name":"02B Subject-verb agreement - Test.md","text":"---\nTitle: Agreement: Test\n---\nFILLER: these questions are pasted in the Word-page layout to show that it works too.\n\n## Question\nQuestion: The box of client files ___ on the front desk.\nOptions: A) is · B) are · C) were\nCorrect answer: A\nFeedback:\nB) Files is inside the prepositional phrase of client files. The head is box, which is singular.\nC) Were is plural, but the head box is singular.\nHint: Cross out the phrase that starts with of.\n\n## Question\nQuestion: A number of clients ___ asked about the new fees.\nOptions: A) has · B) have · C) is\nCorrect answer: B\nFeedback:\nA) A number of works like several, so the real head is clients, which is plural.\nC) Is is singular, and a number of needs a plural verb.\nHint: Swap a number of for several. Which verb sounds right now?\n\n## Question\nQuestion: Each of the lawyers ___ a parking pass.\nOptions: A) has · B) have · C) are\nCorrect answer: A\nFeedback:\nB) Of the lawyers is clutter. The subject is each, which is always singular.\nC) Are is plural, and it doesn\u0027t fit the meaning of the sentence.\nHint: Cross out the of phrase. What word is left before the blank?\n\n## Mini-boss: The courier list\nDocument: Memo\nTo: You\nFrom: Omar Haddad, Senior Paralegal\nRe: Hearing materials\nPenalty: 10\nHint: There are three errors. Cross out every \"of\" phrase first.\nFILLER passage. The courier leaves at noon.\nPassage:\nThe list of exhibits for the hearing {are =\u003e is | The head of the subject is list, which is singular.} on the shared drive. Each of the associates {have =\u003e has | Cross out \"of the associates.\" Each is singular.} a printed copy.\n\nA number of clients {have =\u003e have | A number of works like several, so the plural verb is correct.} asked for updates, and the box of signed forms {need =\u003e needs | The head is box. Cross out \"of signed forms.\"} to go to the courier by noon.\n"},{"name":"03A Good well bad badly.md","text":"---\nTitle: Good/Well, Bad/Badly\nLevel: The Client Update\nDocument: Email\nFrom: Priya Sandhu, Legal Assistant\nTo: You\nSubject: Quick tip before you write the client update\n---\n\u003e FILLER: replace with your rewritten Level 3 page.\n\n**Rule:** After an action verb, use an adverb (*well*, *badly*). After a linking verb, use an adjective (*good*, *bad*).\n\n✓ I feel bad about the mistake. (*feel* is a linking verb here)\n✗ She did good on the exam. → well\n\n**Be test:** replace the verb with *is* or *was*. If the sentence still makes sense, it\u0027s a linking verb, so use the adjective.\n"},{"name":"03B Good well bad badly - Test.md","text":"---\nTitle: Good/Well, Bad/Badly: Test\n---\n## Question\nThe new associate writes ___.\n\nA) good\nB) well\nC) goodly\nAnswer: B\nFeedback A: Writes is an action verb, so it needs an adverb. Good is an adjective.\nFeedback C: Goodly is not a standard word for this meaning. The adverb form of good is well.\nHint: Is writes an action or a state?\n\n## Question\nThe coffee in the break room smells ___.\n\nA) good\nB) well\nC) nicely\nAnswer: A\nFeedback B: Smells is a linking verb here, so it needs an adjective. As an adjective, well means \"healthy,\" and coffee can\u0027t be healthy in that way.\nFeedback C: Nicely is an adverb, but a linking verb needs an adjective.\nHint: Try the be test: The coffee is ___.\n\n## Question\nThe witness answered the questions ___.\n\nA) bad\nB) badly\nC) worst\nAnswer: B\nFeedback A: Answered is an action verb, so it needs the adverb badly.\nFeedback C: Worst is a superlative adjective, so it can\u0027t describe an action.\nHint: Ask how did she answer?\n\n## Inspect: The office newsletter\nDocument: Memo\nTo: All staff\nFrom: Dana Whitfield, Office Manager\nRe: The new filing system\nFILLER passage. Is it ready to go out?\nPassage:\nThe new filing system works {well =\u003e well | Works is an action verb, so the adverb well is correct.}. Priya feels {good =\u003e good | Feels is a linking verb here, so the adjective good is correct.} about the change, and the clients seem happy with our faster replies.\n\n## Mini-boss: The client update\nDocument: Email\nFrom: You\nTo: Priya Sandhu\nSubject: Ramsay file update\nPenalty: 10\nHint: There are three errors. Check each verb: action or linking?\nFILLER passage. Priya needs your reply before her 3 p.m. call.\nPassage:\nHi Priya,\n\nThanks for helping with the Ramsay file. You did {good =\u003e well | Did is an action verb, so it needs the adverb well.} on the first draft, and the partner was pleased. I feel {badly =\u003e bad | Feel is a linking verb here, so it takes the adjective bad.} that I sent the exhibit list so late.\n\nThe client seemed {happily =\u003e happy | Seemed is a linking verb. Use the adjective happy.} with the timeline, so the meeting went {well =\u003e well | Went is an action verb here, so the adverb well is correct.}.\n"},{"name":"04A She and I between you and me.md","text":"---\nTitle: She and I / Between You and Me\nLevel: Between You and Me\nDocument: Letter\nDate: November 24, 2026\nTo: You\nRe: Pronouns in client letters\n---\n\u003e FILLER: replace with your rewritten Level 4 page.\n\n**Rule:** Use the subject form (*I, she, he, we, they*) for whoever does the action. Use the object form (*me, her, him, us, them*) for whoever receives the action, or after a preposition.\n\n✓ She and I have been friends forever.\n✗ Between you and I, the file is late. → you and me\n\n**Drop-the-name test:** cover the other person\u0027s name. *The manager asked ~~Omar and~~ me* sounds right; *asked I* doesn\u0027t.\n"},{"name":"04B She and I - Test.md","text":"---\nTitle: She and I: Test\n---\n## Question\nThe manager asked Omar and ___ to review the contract.\n\nA) I\nB) me\nC) myself\nAnswer: B\nFeedback A: The manager did the asking, so the pronoun receives the action. It needs the object form.\nFeedback C: Myself only works when I appears earlier in the same sentence, as in I asked myself.\nHint: Cover Omar and. What sounds right after asked?\n\n## Question\nBetween you and ___, the deadline is unrealistic.\n\nA) I\nB) me\nC) myself\nAnswer: B\nFeedback A: Between is a preposition, so the pronoun after it must be in the object form.\nFeedback C: Myself needs an earlier I in the sentence, and there isn\u0027t one.\nHint: Would you say between us or between we?\n\n## Question\nIn formal writing, which word completes the sentence? My sister types faster than ___.\n\nA) I\nB) me\nC) myself\nAnswer: A\nFeedback B: Than me is common in speech, but formal writing finishes the comparison: than I do.\nFeedback C: Myself needs an earlier I in the sentence.\nHint: Finish the sentence: …faster than ___ do.\n\n## Mini-boss: The binder email\nDocument: Email\nFrom: You\nTo: Ms. Chen\nSubject: Ramsay binder\nPenalty: 10\nHint: There are three errors. Use the drop-the-name test on each pronoun.\nFILLER passage.\nPassage:\nBetween you and {I =\u003e me | Between is a preposition, so use the object form.}, the Ramsay binder is late. The partner asked Omar and {myself =\u003e me | Myself needs an earlier I in the same sentence.} to finish it tonight.\n\n{Him =\u003e He | Test it alone: He will bring the exhibits.} and Priya will bring the exhibits. Please send any questions to Ms. Chen or {me =\u003e me | To is a preposition, so the object form me is correct.}.\n"},{"name":"05A Who whom whoever.md","text":"---\nTitle: Who, Whom, Whoever\nLevel: The Witness\nDocument: Memo\nTo: You\nFrom: Ms. Lessing, Partner\nRe: Who or whom?\n---\n\u003e FILLER: replace with your rewritten Level 5 page.\n\n**Rule:** Look only inside the word\u0027s own clause. If it acts as a subject there, use *who* or *whoever*. If it acts as an object, use *whom* or *whomever*.\n\n✓ The client whom we called is here. (we called **him**)\n✗ We will send whomever is nearest. → whoever (**he** is nearest)\n\n**He/him swap:** rewrite the clause with *he* or *him*. *He* → who. *Him* → whom.\n"},{"name":"05B Who whom whoever - Test.md","text":"---\nTitle: Who and Whom: Test\n---\n## Question\nThe paralegal ___ found the error deserves credit.\n\nA) who\nB) whom\nC) whomever\nAnswer: A\nFeedback B: Rewrite the clause: he found the error. He is a subject form, so the answer is who.\nFeedback C: Whomever is an object form, and it means \"any person.\" This sentence is about one specific paralegal.\nHint: Did he or him find the error?\n\n## Question\nGive the file to ___ is at the front desk.\n\nA) whoever\nB) whomever\nC) whom\nAnswer: A\nFeedback B: The whole clause is the object of to. Inside the clause, he is at the front desk, so the pronoun is a subject.\nFeedback C: Whom is an object form, but inside the clause the pronoun is the subject of is.\nHint: Ignore to. Look at the verb right after the blank.\n\n## Question\n___ do you think will win the case?\n\nA) Who\nB) Whom\nC) Whomever\nAnswer: A\nFeedback B: Cover do you think: ___ will win the case. He will win, so the answer is who.\nFeedback C: Whomever is an object form, and this is a question about one person.\nHint: Cover the words do you think.\n\n## Inspect: The hearing reminder\nDocument: Email\nFrom: Ms. Lessing, Partner\nTo: You\nSubject: Thursday\u0027s hearing\nFILLER passage. Is it ready to go out?\nPassage:\nThe paralegal {who =\u003e who | He drafted the motion, so who is correct.} drafted the motion will be at the hearing. Please send the binder to {whoever =\u003e whoever | Inside the clause, he asks for it, so whoever is correct.} asks for it first. The client {whom =\u003e whom | We met him, so whom is correct.} we met on Tuesday has signed the retainer.\n\n## Mini-boss: The witness memo\nDocument: Memo\nTo: Ms. Lessing\nFrom: You\nRe: Trial preparation\nPenalty: 10\nHint: There are three errors. Do the he/him swap inside each clause.\nFILLER passage.\nPassage:\nThe witness {who =\u003e whom | The lawyer interviewed him, so use whom.} the lawyer interviewed on Monday has agreed to testify. The clerk {whom =\u003e who | He found the error, so use who.} found the error should get credit.\n\nPlease give the transcript to {whomever =\u003e whoever | Inside the clause, he asks first. The subject wins: whoever.} asks first. The expert {whom =\u003e whom | We hired him, so whom is correct.} we hired will arrive at nine.\n"},{"name":"06A Ending with prepositions.md","text":"---\nTitle: Ending a Sentence with a Preposition\nLevel: Where It\u0027s At\nDocument: Email\nFrom: Omar Haddad, Senior Paralegal\nTo: You\nSubject: Yes, you can end a sentence with \"with\"\n---\n\u003e FILLER: replace with your rewritten Level 6 page.\n\n**Rule:** Ending with a preposition is correct English. For very formal writing, you can move the preposition to the front. Cut a final preposition only when it adds nothing.\n\n✓ Who should I give this to?\n✗ Where is the file at? → Where is the file?\n\n**Remove test:** take the last word away. If the meaning stays the same, cut it.\n"},{"name":"06B Ending with prepositions - Test.md","text":"---\nTitle: Prepositions: Test\n---\n## Question\nWhich sentence is the most formal?\n\nA) Who did you send the file to?\nB) To whom did you send the file?\nC) Whom did you send the file to?\nAnswer: B\nFeedback A: This is correct, but casual: it uses who and leaves to at the end.\nFeedback C: Whom is the formal pronoun, but the preposition is still at the end. B is more formal.\nHint: Which sentence keeps the preposition next to its object?\n\n## Question\nWhich sentence ends with a preposition that should be cut?\n\nA) Where is the hearing at?\nB) Which room is the hearing in?\nC) What is the hearing about?\nAnswer: A\nFeedback B: Without in, the sentence no longer makes sense. The preposition is needed.\nFeedback C: Without about, the meaning changes. The preposition is needed.\nHint: Remove the last word. Does the sentence still mean the same thing?\n\n## Question\nIs this sentence correct? She is the lawyer whom I spoke with.\n\nA) Yes\nB) No, because a sentence can\u0027t end with a preposition\nC) No, because whom should be who\nAnswer: A\nFeedback B: That rule is a myth. Ending with a preposition is correct English.\nFeedback C: Inside the clause, I spoke with her, so the pronoun is an object and whom is correct.\nHint: Check the pronoun with the he/him swap from Level 5.\n\n## Mini-boss: The meeting reply\nDocument: Email\nFrom: You\nTo: Omar Haddad\nSubject: Re: Tomorrow\u0027s meeting\nPenalty: 10\nHint: There are three extra words to delete. One sentence ends with a preposition that\u0027s needed.\nFILLER passage. Use **Delete it** for words that add nothing.\nPassage:\nHi Omar,\n\nCan you tell me where the Ramsay file is {at =\u003e | Where already means \"at what place,\" so at adds nothing.}? The client we spoke {with =\u003e with | Spoke with needs with. Ending with it is fine.} yesterday wants to know where the courier went {to =\u003e | Where already means \"to what place,\" so to can go.}.\n\nAlso, where is the boardroom key kept {at =\u003e | Again, where already says \"at what place.\"}?\n"},{"name":"07A Commas that change meaning.md","text":"---\nTitle: Commas That Change Meaning\nLevel: A Matter of Commas\nDocument: Memo\nTo: All staff\nFrom: Ms. Fewster, Partner\nRe: That, which and the Oxford comma\n---\n\u003e FILLER: replace with your rewritten Level 7 page.\n\n**Rule:** If a clause tells you *which one*, use *that* with no commas. If it only adds extra information, use *which* with commas. In a list, a comma before the final *and* prevents misreading.\n\n✓ The contract that Omar drafted is late.\n✗ The contract which Omar drafted is late. → that\n\n**Brackets test:** put the clause in brackets and read the sentence without it. If the reader still knows which one you mean, the clause is extra: use *which* and commas.\n"},{"name":"07B Commas that change meaning - Test.md","text":"---\nTitle: Commas: Test\n---\n## Question\nCalgary, ___ hosted the 1988 Winter Olympics, is in Alberta.\n\nA) that\nB) which\nC) who\nAnswer: B\nFeedback A: There is only one Calgary, so the clause is extra information. A non-essential clause starts with which.\nFeedback C: Who is for people, not places.\nHint: Do we already know which Calgary the sentence means?\n\n## Question\nWhich sentence says that all the paralegals got a bonus?\n\nA) The paralegals who worked late got a bonus.\nB) The paralegals, who worked late, got a bonus.\nAnswer: B\nFeedback A: With no commas, the clause picks out only the paralegals who worked late. Only some got a bonus.\nHint: Commas = all. No commas = only some.\n\n## Question\nThe report, is on the desk that Omar uses. Which comma rule does this sentence break?\n\nA) A comma separates the subject from its verb.\nB) The that clause needs commas.\nC) It breaks no rule.\nAnswer: A\nFeedback B: That Omar uses tells you which desk, so it is essential and takes no commas.\nFeedback C: The comma between report and is splits the subject from its verb.\nHint: Find the subject and the verb. Should anything come between them?\n\n## Inspect: The Friday notice\nDocument: Memo\nTo: All staff\nFrom: Dana Whitfield, Office Manager\nRe: Office closure\nFILLER passage. Is it ready to go out?\nPassage:\nThe binder {that =\u003e that | It tells you which binder, so that with no commas is correct.} holds the exhibits is on my desk. Our office, {which =\u003e which | We only have one office, so which with commas is correct.} overlooks the river, will be closed on Friday. Please bring pens, sticky {notes, =\u003e notes, | The Oxford comma keeps the list clear.} and the client list on Monday.\n\n## Mini-boss: The all-staff memo\nDocument: Memo\nTo: All staff\nFrom: You, for Ms. Fewster\nRe: Friday\u0027s client meeting\nPenalty: 10\nHint: There are three errors. Click the word the comma is attached to.\nFILLER passage.\nPassage:\nThe contract {which =\u003e that | The clause tells you which contract, so use that with no commas.} Omar drafted is ready for review. The {report, =\u003e report | Don\u0027t put a comma between the subject and its verb.} is on the front desk.\n\nOn Friday, we will meet the clients, {Jordan =\u003e Jordan, | Without the Oxford comma, the clients could be Jordan and Priya.} and Priya. Calgary, {which =\u003e which | Calgary is already known, so the clause adds extra information: which with commas is correct.} hosted the 1988 Winter Olympics, is where the meeting will be.\n"},{"name":"08A Final boss - Briefing.md","text":"---\nTitle: The Affidavit Briefing\nLevel: Filing Day\nDocument: Email\nFrom: Ms. Fewster, Managing Partner\nTo: You\nSubject: URGENT: Lee affidavit must be filed today\n---\n\u003e FILLER: replace with your own briefing.\n\nThe filing counter closes at 4:30 p.m., and Jordan Lee\u0027s affidavit still needs a final proofread.\n\nOur junior associate drafted it in a hurry. Expect one error from every rule you\u0027ve learned: fewer/less, agreement, good/well, pronouns, who/whom, extra prepositions and that/which.\n\nBe careful: some sentences are already correct. If you change them, you\u0027ll lose time you don\u0027t have.\n\nMs. Fewster\n"},{"name":"08B Final boss - Affidavit.md","text":"---\nTitle: Final Boss: The Affidavit\nPass: 50%\n---\n## Final boss: Affidavit of Jordan Lee\nDocument: Court filing\nCourt: Court of King\u0027s Bench of Alberta\nJudicial centre: Calgary\nBetween: Ramsay Holdings Ltd., Plaintiff, and Northgate Couriers Inc., Defendant\nFiling: Affidavit of Jordan Lee\nPenalty: 10\nHint: There are seven errors, one for each level, and two traps.\nFILLER passage. The filing counter closes at 4:30 p.m.\nPassage:\n# Affidavit\n\nI, Jordan Lee, of the City of Calgary, in the Province of Alberta, make oath and say that:\n\n1. I am the office manager of Ramsay Holdings Ltd., the Plaintiff in this action, and I have personal knowledge of the matters in this affidavit.\n\n2. In March 2026, the Defendant delivered {less =\u003e fewer | Shipments can be counted, so use fewer.} than 12 of our 40 shipments on time.\n\n3. The list of damaged items {are =\u003e is | The head of the subject is list, which is singular.} attached as Exhibit A.\n\n4. The Defendant\u0027s drivers handled the boxes {bad =\u003e badly | Handled is an action verb, so it needs the adverb badly.}.\n\n5. On April 2, 2026, the Defendant\u0027s manager sent an apology to my assistant and {I =\u003e me | To is a preposition. Drop \"my assistant and\": sent an apology to me.}. The manager {whom =\u003e whom | I called him, so whom is correct.} I called on April 3 did not return my call.\n\n6. The driver {who =\u003e whom | The Defendant hired him, so the pronoun is an object: whom.} the Defendant hired in March had no training.\n\n7. I do not know where the damaged boxes are now stored {at =\u003e | Where already means \"at what place,\" so at adds nothing.}.\n\n8. The invoice {which =\u003e that | The clause tells you which invoice, so use that with no commas.} the Defendant sent on April 9 is attached as Exhibit B. The Defendant has paid {less =\u003e less | Money is an amount, so less is standard.} than $500 of the $8,000 it owes.\n\nSworn before me at Calgary, Alberta, on April 20, 2026.\n"},{"name":"game.md","text":"---\nTitle: Grammar Guide: The Proofreader\u0027s Desk\nFirm: Fewster \u0026 Lessing LLP\nSubtitle: Your first weeks as a legal assistant\nStart: Start your first day\nPass: 50%\nBoss: Ms. Fewster, Managing Partner\nReviewer: Ms. Fewster, Managing Partner\nNote 3: Excellent work.\nNote 2: Acceptable.\nNote 1: See me tomorrow morning.\nNote fail: Not good enough. Do it again.\nEnding: FILLER: You made it through every file on your desk. The partners noticed. (Write your own ending here.)\n---\nFILLER: Welcome to Fewster \u0026 Lessing LLP. Every day, a lesson lands on your desk, then the documents start coming. Approve the clean ones, return the ones with errors, and beat each deadline. (Replace this with your own intro.)\n"}],"images":{},"built":"2026-11-24 18:24"};
</script>
<script>
(function () {
'use strict';
/* Level-file parser: reads the .md files packed in window.GAME_DATA. Shared by scene.js, sound.js and game.js (build.ps1 joins them). */

  var DATA = window.GAME_DATA || { files: [], images: {} };
  var app = document.getElementById('app');

  /* ---------------------------------------------------------------- utilities */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function el(tag, props) {
    var n = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v == null || v === false) return;
        if (k === 'class') n.className = v;
        else if (k === 'html') n.innerHTML = v;
        else if (k === 'text') n.textContent = v;
        else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v === true ? '' : v);
      });
    }
    for (var i = 2; i < arguments.length; i++) append(n, arguments[i]);
    return n;
  }
  function append(n, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { append(n, k); }); return; }
    n.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }

  // Normalise typed answers: curly quotes → straight, collapse spaces.
  function norm(s) {
    return String(s || '').replace(/[‘’ʼ]/g, "'").replace(/[“”]/g, '"')
      .replace(/\s+/g, ' ').trim();
  }

  function slug(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

  // "4:30 p.m." → minutes after midnight
  function parseTime(s) {
    if (!s) return null;
    var m = String(s).match(/(\d{1,2})(?::(\d{2}))?\s*(a\.?\s*m\.?|p\.?\s*m\.?|noon)?/i);
    if (!m) return null;
    var h = parseInt(m[1], 10), min = m[2] ? parseInt(m[2], 10) : 0, ap = (m[3] || '').toLowerCase().replace(/[\s.]/g, '');
    if (ap === 'pm' && h < 12) h += 12;
    if (ap === 'am' && h === 12) h = 0;
    if (ap === 'noon') h = 12;
    return h * 60 + min;
  }
  function fmtTime(mins) {
    var h = Math.floor(mins / 60) % 24, m = mins % 60, ap = h >= 12 ? 'p.m.' : 'a.m.';
    var h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
  }

  /* ---------------------------------------------------------------- markdown */

  function imageHtml(alt, src) {
    var raw = src.replace(/&amp;/g, '&');
    var url = null;
    if (/^(https?:|data:)/i.test(raw)) url = raw;
    else {
      var key = raw.replace(/^\.?\//, '').toLowerCase();
      try { key = decodeURI(key); } catch (e) { /* keep as is */ }
      url = DATA.images[key] || DATA.images['images/' + key] || null;
    }
    if (!url) return '<span class="img-missing">[Picture not found: ' + esc(raw) + ']</span>';
    return '<img src="' + esc(url) + '" alt="' + alt + '">';
  }

  function inline(s) {
    var t = esc(s);
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, src) { return imageHtml(alt, src); });
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, txt, url) {
      return /^(https?:|mailto:)/i.test(url) ? '<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>' : txt;
    });
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g, '$1<em>$2</em>');
    t = t.replace(/~~(.+?)~~/g, '<del>$1</del>');
    return t;
  }

  var RE = {
    heading: /^(#{1,4})\s+(.*)$/,
    hr: /^\s*(-{3,}|\*{3,}|_{3,})\s*$/,
    quote: /^\s*>/,
    ul: /^\s*[-*+]\s+/,
    ol: /^\s*\d+[.)]\s+/,
    tick: /^\s*[✓✔✗✘]/,
    tableRow: /^\s*\|/,
    tableSep: /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/
  };
  function startsBlock(line, next) {
    return RE.heading.test(line) || RE.hr.test(line) || RE.quote.test(line) || RE.ul.test(line) ||
      RE.ol.test(line) || RE.tick.test(line) || (RE.tableRow.test(line) && next != null && RE.tableSep.test(next));
  }

  function md(src) {
    var lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0, m;
    function listItems(re) {
      var items = [];
      while (i < lines.length && re.test(lines[i])) {
        items.push(lines[i].replace(re, ''));
        i++;
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !re.test(lines[i])) { items[items.length - 1] += '\n' + lines[i].trim(); i++; }
      }
      return items.map(function (t) { return '<li>' + t.split('\n').map(inline).join('<br>') + '</li>'; }).join('');
    }
    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }
      if ((m = line.match(RE.heading))) {
        var lv = Math.min(m[1].length + 1, 5);
        out.push('<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>'); i++; continue;
      }
      if (RE.hr.test(line)) { out.push('<hr>'); i++; continue; }
      if (RE.quote.test(line)) {
        var q = [];
        while (i < lines.length && RE.quote.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote>' + md(q.join('\n')) + '</blockquote>'); continue;
      }
      if (RE.tableRow.test(line) && i + 1 < lines.length && RE.tableSep.test(lines[i + 1])) {
        var row = function (l) { return l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); }); };
        var head = row(line); i += 2; var body = [];
        while (i < lines.length && RE.tableRow.test(lines[i])) { body.push(row(lines[i])); i++; }
        out.push('<div class="table-wrap"><table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' + body.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
          '</tbody></table></div>');
        continue;
      }
      if (RE.ul.test(line)) { out.push('<ul>' + listItems(RE.ul) + '</ul>'); continue; }
      if (RE.ol.test(line)) { out.push('<ol>' + listItems(RE.ol) + '</ol>'); continue; }
      if (RE.tick.test(line)) {

  /* ---------- the clock */

  function loseHeart() {

  function floatText(text, cls, x, y) {

  }

  /* ---------- items */

  function nextItem() {

    setStamps('off'); RUN.onStamp = null; keyHandler = null;
    var it = RUN.day.items[RUN.pos];
    if (!it) { endOfDay('done'); return; }
    Sound.play('paper');
    if (it.kind !== 'note') SC.inbox = Math.max(0, SC.inbox - 1);

  }
  function finishItem(result, card) {

  }

  function showMemo(it) {
    var card = el('article', { class: 'paper card-small enter' },
      el('p', { class: 'paper-tag', text: 'Note from ' + BOSS_SHORT }),

      el('div', { class: 'md', html: md(it.body) }));

  }

  function showSticky(it) {

    var fb = el('div', { class: 'note-fb', 'aria-live': 'polite' });
    var card;
    var opts = it.options.map(function (o) {
      var b = el('button', { class: 'opt', type: 'button' }, el('span', { class: 'opt-l', text: o.letter }), el('span', { class: 'opt-t', html: inline(o.text) }));
      b.addEventListener('click', function () { pick(o, b); });
      return b;
    });
    var hintBtn = it.hint ? btn('Hint (−$' + (PAY.note - PAY.hint) + ')', function () {

    }, 'small ghost') : null;
    var nextBtn = btn('Into the outbox ▸', function () {

    }, '', { hidden: true });
    function pick(o, b) {
      if (solved || b.disabled || RUN.ended) return;
      if (o.letter === it.answer) {
        solved = true;
        b.classList.add('right');
        opts.forEach(function (x) { x.disabled = true; });
        Sound.play('right');
        var earned = wrongs.length ? 0 : hintUsed ? PAY.hint : PAY.note;

        fb.className = 'note-fb good';
        fb.innerHTML = '<strong>' + (wrongs.length ? 'That’s it.' : 'Correct!') + '</strong>' + (it.explain ? ' ' + it.explain.split('\n').map(inline).join('<br>') : '');
        if (hintBtn) hintBtn.remove();

      } else {

  function showDoc(it) {
    var kind = slug(it.document || 'memo');
    var found = 0, mistakes = 0, revealed = 0, over = 0, current = null, locked = false;
    var markSpans = [];
    var log = el('ol', { class: 'log', 'aria-live': 'polite' });
    var counter = el('span', { class: 'counter', text: 'Corrections: 0' });
    var msg = el('div', { class: 'doc-msg', 'aria-live': 'polite' });

    function say(cls, html) { msg.className = 'doc-msg ' + cls; msg.innerHTML = html; }

    function closePanel() { panel.hidden = true; if (current) current.span.classList.remove('sel'); current = null; }

    function fixLine(mark, text) {

      if (m.rights.some(function (r) { return norm(r) === v; })) { Sound.play('right'); say('good', '<strong>Corrected.</strong>'); solve(value.trim(), 'fixed'); return; }

      return p;
    });

    var paper = el('article', { class: 'paper passage enter doc-' + kind },
      el('div', { class: 'paper-bar' }, el('span', { class: 'paper-tag', text: it.title }), counter),
      it.intro ? el('div', { class: 'md doc-intro', html: md(it.intro) }) : null,
      docHeader(kind, it.header, it.title),
      el('div', { class: 'passage-body' }, body),

    var hintBtn = it.hint ? btn('Hint', function () { hintBtn.remove(); say('hint', '<strong>Hint:</strong> ' + inline(it.hint)); }, 'small ghost') : null;

      var hasErrors = it.errors > 0;
      var right = hasErrors ? choice === 'return' : choice === 'approve';
      var missed = 0;
      markSpans.forEach(function (ms) {
        if (ms.seg.solved) return;
        missed++;
        showFix(ms.span, ms.seg, ms.seg.rights[0] || '', 'missed');

      });
      paper.classList.add('locked');
      paper.appendChild(el('div', { class: 'impression imp-' + choice, 'aria-hidden': 'true', text: choice === 'approve' ? 'Approved' : 'Returned' }));
      var title, text, bossLine;
      if (choice === 'approve' && hasErrors) { title = 'This went out with errors'; text = plural(missed, 'error') + ' reached the client. They’re marked in blue.'; bossLine = 'approvebad'; }
      else if (choice === 'approve') { title = 'Approved. Nothing needed fixing.'; text = it.success ? inline(it.success) : 'Good call: every word was already correct.'; bossLine = 'clean'; }
      else if (!hasErrors) { title = 'Returned, but nothing was wrong'; text = 'This document was already correct.'; bossLine = 'returnclean'; }
      else if (missed) { title = 'Returned, but you missed ' + plural(missed, 'error'); text = 'They’re marked in blue.'; bossLine = 'missed'; }
      else { title = 'Returned with every error corrected'; text = it.success ? inline(it.success) : 'Clean work.'; bossLine = 'clean'; }
      if (over) text += ' You changed ' + plural(over, 'correct word') + '.';

  }

  /* ---------- the end of the day */

    }

    var card = el('div', { class: 'px-panel day-intro' },

  function fired() {

    bossSay(line('fired'), 6000);
    var d = RUN.day;
    var card = el('div', { class: 'px-panel day-intro fired' },

        btn('Your week', renderPlanner, 'ghost')));

  }

  function finishDayNoTest() {
    var d = RUN.day;
    progress.days[d.num] = progress.days[d.num] || { read: true };
    save();
    RUN.ended = true;
    Sound.play('done');
    var nd = nextDay();
    openOverlay(el('div', { class: 'px-panel day-intro' },
      el('h1', { text: dayLabel(d) + ' done' }),
      el('div', { class: 'row center' },
        nd ? btn('Start ' + dayLabel(nd), function () { startDay(nd); }, 'big', { 'data-autofocus': true }) : btn('Read your performance review', renderReview, 'big', { 'data-autofocus': true }),
        btn('Your week', renderPlanner, 'ghost'))), null);
  }

  function endOfDay(reason) {
    var d = RUN.day;
    RUN.ended = true; RUN.clockOn = false;
    if (reason === 'done') { Sound.play('done'); bossSay(line('done')); }
    var scored = RUN.results.filter(Boolean);
    var total = 0;
    scored.forEach(function (r) { total += r.kind === 'mc' ? (r.firstTry ? (r.hint ? 0.75 : 1) : 0) : r.score; });
    var pct = scored.length ? Math.round(total / scored.length * 100) : 100;
    var nStars = pct >= 90 ? 3 : pct >= 70 ? 2 : 1;
    var passed = d.pass == null || pct >= d.pass;
    var mcs = scored.filter(function (r) { return r.kind === 'mc'; });
    var docs = scored.filter(function (r) { return r.kind === 'proof'; });

    }

    var note = d.meta[noteKey] || (passed && d.meta.note) || S[noteKey] || DEFAULT_NOTES[noteKey];

    function row(label, count, amount) {

    if (mcs.length) rows.push(row('Sticky notes right first try', mcs.filter(function (r) { return r.firstTry; }).length + ' / ' + mcs.length, RUN.payNotes));
    if (docs.length) {
      rows.push(row('Documents stamped correctly', docs.filter(function (r) { return r.right && !r.missed; }).length + ' / ' + docs.length, RUN.payDocs));
      rows.push(row('Errors corrected', String(sum('found')), null));
      rows.push(row('Errors missed', String(sum('missed')), null));
      rows.push(row('Correct words changed', String(sum('over')), RUN.fines));
    }
    if (RUN.hints) rows.push(row('Hints used', String(RUN.hints), null));
    if (unfinished) rows.push(row('Unfinished', String(unfinished), null));
    var missedQs = mcs.filter(function (r) { return !r.firstTry && !r.unfinished; });
    var nd = DAYS[d.index + 1];
    var slip = el('div', { class: 'px-panel slip' },
      el('div', { class: 'slip-head' },
        el('p', { class: 'slip-kicker', text: 'Pay slip · ' + FIRM }),
        el('h1', { text: dayLabel(d) })),
      el('table', { class: 'slip-rows' }, el('tbody', null, rows)),
      el('div', { class: 'slip-total' },
        el('span', null, 'Total pay ', el('strong', { text: money(RUN.pay) })),
        el('span', null, 'Score ', el('strong', { text: pct + '%' }), ' ', passed ? stars(nStars) : null)),
      passed ? null : el('p', { class: 'warn-text', text: 'You need ' + d.pass + '% to pass this day.' }),
      el('blockquote', { class: 'boss-note' }, el('p', { text: '“' + note + '”' }), el('cite', { text: '— ' + BOSS })),
      missedQs.length ? el('details', { class: 'review' },
        el('summary', { text: 'Worth another look (' + missedQs.length + ')' }),
        el('ol', null, missedQs.map(function (r) {
          var right = r.item.options.filter(function (o) { return o.letter === r.item.answer; })[0];
          return el('li', null, el('div', { class: 'md', html: md(r.item.question) }),
            el('p', { class: 'review-answer', html: 'Answer: <strong>' + esc(r.item.answer) + ')</strong> ' + (right ? inline(right.text) : '') }),
            r.item.explain ? el('p', { class: 'tiny', html: inline(r.item.explain) }) : null);
        }))) : null,
      el('div', { class: 'row center' },
        passed && nd ? btn('Start ' + dayLabel(nd) + ' ▸', function () { startDay(nd); }, '', { 'data-autofocus': true })
          : passed && !nextDay() ? btn('Read your performance review', renderReview, '', { 'data-autofocus': true }) : null,
        btn('Redo this day', function () { startDay(d); }, passed ? 'ghost' : '', passed ? null : { 'data-autofocus': true }),
        btn('Your week', renderPlanner, 'ghost')));
    setTimeout(function () { openOverlay(slip, null); }, reason === 'done' ? 500 : 0);
  }

  /* ---------------------------------------------------------------- rulebook */

  function openRulebook() {
    if (layer.querySelector('.book')) { closeTopOverlay(); return; }
    var upTo = RUN ? RUN.day.num : Infinity;
    var lessons = GAME.steps.filter(function (s) { return s.kind === 'lesson' && s.num <= upTo; });
    var page = el('div', { class: 'book-page md' });
    var tabs = el('nav', { class: 'book-tabs', 'aria-label': 'Rulebook sections' });
    function showLesson(s, b) {
      tabs.querySelectorAll('button').forEach(function (x) { x.classList.remove('cur'); x.removeAttribute('aria-current'); });
      b.classList.add('cur'); b.setAttribute('aria-current', 'true');
      page.innerHTML = '';
      var d = DAYS.filter(function (x) { return x.num === s.num; })[0];
      append(page, [el('p', { class: 'tiny', text: d ? dayLabel(d) : '' }), el('h2', { text: s.title })]);
      page.insertAdjacentHTML('beforeend', md(s.body));
      page.scrollTop = 0;
    }
    var last = null;
    lessons.forEach(function (s) {
      var d = DAYS.filter(function (x) { return x.num === s.num; })[0];
      var b = el('button', { type: 'button' }, el('span', { class: 'tab-day', text: d ? 'Day ' + d.no : '' }), el('span', { text: s.title }));
      b.addEventListener('click', function () { Sound.play('paper'); showLesson(s, b); });
      tabs.appendChild(b); last = { s: s, b: b };
    });
    var book = el('div', { class: 'book', role: 'dialog', 'aria-label': 'Rulebook' },
      el('div', { class: 'book-head' }, el('strong', { text: 'Rulebook' }),
        RUN && RUN.clockOn ? el('span', { class: 'tiny', text: 'The clock keeps running' }) : null,
        btn('Close', function () { closeTopOverlay(); }, 'small ghost', { 'data-autofocus': true })),
      el('div', { class: 'book-body' }, tabs, lessons.length ? page : el('p', { class: 'book-page', text: 'No lessons yet.' })));
    var prevFocus = document.activeElement;
    Sound.play('paper');
    openOverlay(book, function () { if (prevFocus && prevFocus.focus) prevFocus.focus(); });
    if (last) showLesson(last.s, last.b);
  }

  /* ---------------------------------------------------------------- performance review */

  function renderReview() {
    stopRun();
    clearLayer();
    SC.mode = 'title';
    var tested = DAYS.filter(function (d) { return d.items.length; });
    var earned = 0;
    tested.forEach(function (d) { earned += (progress.days[d.num] && progress.days[d.num].stars) || 0; });
    var panel = el('div', { class: 'px-panel slip review-panel' },
      el('div', { class: 'slip-head' }, el('p', { class: 'slip-kicker', text: 'Memorandum · ' + FIRM }), el('h1', { text: 'Performance review' })),
      el('p', { class: 'tiny', text: 'From ' + (S.reviewer || BOSS) }),
      el('table', { class: 'slip-rows' }, el('tbody', null, tested.map(function (d) {
        var r = progress.days[d.num] || {};
        return el('tr', null, el('th', { scope: 'row', text: dayLabel(d) }), el('td', { class: 'c', text: r.best != null ? r.best + '%' : '–' }), el('td', { class: 'a' }, stars(r.stars || 0)));
      }))),
      el('div', { class: 'slip-total' },
        el('span', null, 'Stars ', el('strong', { text: earned + ' / ' + tested.length * 3 })),
        el('span', null, 'Total pay ', el('strong', { text: money(totalPay()) }))),
      S.ending ? el('div', { class: 'md', html: md(S.ending) }) : el('p', { text: 'You made it through every day on your desk.' }),
      el('div', { class: 'row center' }, btn('Your week', renderPlanner, '', { 'data-autofocus': true }), btn('Title screen', renderTitle, 'ghost')));
    layer.appendChild(el('div', { class: 'planner-wrap', style: at(40, 8, 240, 164) }, panel));
    var f = panel.querySelector('[data-autofocus]'); if (f) f.focus({ preventScroll: true });
    Sound.play('done');
  }

  renderTitle();

})();
</script>
</body>
</html>
